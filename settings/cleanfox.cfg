// CleanFox — configuração central (AutoConfig). A primeira linha deste arquivo é sempre ignorada.
//
// lockPref    -> valor fixo, o usuário NÃO pode mudar (usado só para telemetria/coleta de dados)
// defaultPref -> novo valor padrão, o usuário PODE mudar em about:config / Configurações
//
// Regra do projeto: toda pref aqui precisa de um motivo. Sem "tweaks" de efeito duvidoso.

// ===========================================================================
// 1. TELEMETRIA E COLETA DE DADOS  (travado)
// ===========================================================================
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.server", "data:,");
lockPref("toolkit.telemetry.archive.enabled", false);
lockPref("toolkit.telemetry.newProfilePing.enabled", false);
lockPref("toolkit.telemetry.shutdownPingSender.enabled", false);
lockPref("toolkit.telemetry.firstShutdownPing.enabled", false);
lockPref("toolkit.telemetry.updatePing.enabled", false);
lockPref("toolkit.telemetry.bhrPing.enabled", false);
lockPref("toolkit.coverage.opt-out", true);
lockPref("toolkit.coverage.endpoint.base", "");
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("datareporting.usage.uploadEnabled", false);
lockPref("browser.newtabpage.activity-stream.telemetry", false);
lockPref("browser.search.serpEventTelemetryCategorization.enabled", false);
lockPref("dom.security.unexpected_system_load_telemetry_enabled", false);

// Estudos e experimentos remotos (Normandy / Shield / Nimbus)
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);
lockPref("app.normandy.api_url", "");

// Relatórios de travamento
lockPref("breakpad.reportURL", "");
lockPref("browser.tabs.crashReporting.sendReport", false);
lockPref("browser.crashReports.unsubmittedCheck.enabled", false);
lockPref("browser.crashReports.unsubmittedCheck.autoSubmit2", false);

// Medição de anúncios "privacy-preserving attribution"
lockPref("dom.private-attribution.submission.enabled", false);

// ===========================================================================
// 2. CONEXÕES AUTOMÁTICAS EM SEGUNDO PLANO
// ===========================================================================
// Detecção de portal cativo e teste de conectividade (pingam servidores da Mozilla)
defaultPref("network.captive-portal-service.enabled", false);
defaultPref("captivedetect.canonicalURL", "");
defaultPref("network.connectivity-service.enabled", false);

// Descoberta de região (consulta serviço de localização da Mozilla)
defaultPref("browser.region.update.enabled", false);
defaultPref("browser.region.network.url", "");

// Atualização de "system add-ons" empurrados pela Mozilla fora do ciclo de release
defaultPref("extensions.systemAddon.update.enabled", false);
defaultPref("extensions.systemAddon.update.url", "");

// Pré-carregamento especulativo: conecta a sites que você não pediu para abrir
defaultPref("network.prefetch-next", false);
defaultPref("network.dns.disablePrefetch", true);
defaultPref("network.dns.disablePrefetchFromHTTPS", true);
defaultPref("network.http.speculative-parallel-limit", 0);
defaultPref("browser.urlbar.speculativeConnect.enabled", false);
defaultPref("browser.places.speculativeConnect.enabled", false);

// DNS-over-HTTPS: desligado por escolha (5) para o Firefox não ativar sozinho
// um provedor (Cloudflare) via "rollout". O usuário pode escolher um em Configurações.
defaultPref("network.trr.mode", 5);
defaultPref("doh-rollout.disable-heuristics", true);

// ===========================================================================
// 3. SERVIÇOS DE "BIG TECHS"
// ===========================================================================
// Google Safe Browsing: desligado. A proteção contra sites maliciosos fica a cargo
// das listas do uBlock Origin (instalado por política). Trade-off documentado no README.
// O provedor "mozilla" (listas da Proteção contra Rastreamento) é mantido.
defaultPref("browser.safebrowsing.malware.enabled", false);
defaultPref("browser.safebrowsing.phishing.enabled", false);
defaultPref("browser.safebrowsing.downloads.enabled", false);
defaultPref("browser.safebrowsing.downloads.remote.enabled", false);
defaultPref("browser.safebrowsing.downloads.remote.url", "");
defaultPref("browser.safebrowsing.provider.google.updateURL", "");
defaultPref("browser.safebrowsing.provider.google.gethashURL", "");
defaultPref("browser.safebrowsing.provider.google4.updateURL", "");
defaultPref("browser.safebrowsing.provider.google4.gethashURL", "");
defaultPref("browser.safebrowsing.provider.google4.dataSharing.enabled", false);

// Geolocalização: troca o serviço do Google pelo BeaconDB (comunitário).
// Só é consultado quando você concede permissão de localização a um site.
defaultPref("geo.provider.network.url", "https://api.beacondb.net/v1/geolocate");

// DRM (Widevine, do Google) e download automático de plugins de mídia.
// Netflix/Spotify etc. exigem reativar "Reproduzir conteúdo com DRM" nas Configurações
// e restaurar media.gmp-manager.url.
defaultPref("media.eme.enabled", false);
defaultPref("media.gmp-widevinecdm.enabled", false);
defaultPref("media.gmp-manager.url", "data:text/plain,");

// ===========================================================================
// 4. MINIMALISMO: sem anúncios, promoções, IA embutida ou serviços extras
// ===========================================================================
// Página inicial e nova aba em branco (o mais leve possível)
defaultPref("browser.startup.homepage", "about:blank");
defaultPref("browser.newtabpage.enabled", false);
defaultPref("browser.newtabpage.activity-stream.showSponsored", false);
defaultPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
defaultPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
defaultPref("browser.newtabpage.activity-stream.default.sites", "");
defaultPref("browser.topsites.contile.enabled", false);

// Boas-vindas, "novidades", tour e recomendações
defaultPref("browser.aboutwelcome.enabled", false);
defaultPref("browser.startup.homepage_override.mstone", "ignore");
defaultPref("startup.homepage_welcome_url", "");
defaultPref("startup.homepage_welcome_url.additional", "");
defaultPref("browser.uitour.enabled", false);
defaultPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons", false);
defaultPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features", false);
defaultPref("browser.preferences.moreFromMozilla", false);
defaultPref("browser.vpn_promo.enabled", false);
defaultPref("browser.promo.focus.enabled", false);
defaultPref("browser.promo.pin.enabled", false);
defaultPref("browser.discovery.enabled", false);
defaultPref("extensions.getAddons.showPane", false);
defaultPref("extensions.htmlaboutaddons.recommendations.enabled", false);

// Sugestões patrocinadas e envio do que você digita para o buscador
defaultPref("browser.urlbar.quicksuggest.enabled", false);
defaultPref("browser.urlbar.suggest.quicksuggest.sponsored", false);
defaultPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
defaultPref("browser.search.suggest.enabled", false);
defaultPref("browser.urlbar.suggest.searches", false);

// IA embutida (chatbot na barra lateral, modelos locais, grupos de abas "inteligentes").
// A política GenerativeAI em policies.json desliga o conjunto; estas prefs são o reforço.
defaultPref("browser.ml.enable", false);
defaultPref("browser.ml.chat.enabled", false);
defaultPref("browser.ml.linkPreview.enabled", false);
defaultPref("browser.tabs.groups.smart.enabled", false);

// Conta Firefox / Sync (serviço da Mozilla). Reative com esta pref se quiser usar o Sync.
defaultPref("identity.fxaccounts.enabled", false);

// Interface compacta, sem barra de favoritos por padrão
defaultPref("browser.compactmode.show", true);
defaultPref("browser.uidensity", 1);
defaultPref("browser.toolbars.bookmarks.visibility", "never");

// ===========================================================================
// 5. SEGURANÇA E PRIVACIDADE
// ===========================================================================
// HTTPS em todas as janelas; avisa antes de abrir um site sem HTTPS
defaultPref("dom.security.https_only_mode", true);

// Proteção leve contra fingerprinting. (O modo rigoroso da Proteção contra Rastreamento
// é ligado pela política EnableTrackingProtection: como pref padrão o Firefox o desfaz.)
// (não usamos resistFingerprinting: quebra sites demais para ser padrão)
defaultPref("privacy.fingerprintingProtection", true);
defaultPref("privacy.globalprivacycontrol.enabled", true);

// TLS / certificados
defaultPref("security.tls.enable_0rtt_data", false);
defaultPref("security.ssl.treat_unsafe_negotiation_as_broken", true);
defaultPref("security.cert_pinning.enforcement_level", 2);
defaultPref("browser.xul.error_pages.expert_bad_cert", true);

// Phishing por domínios com caracteres parecidos (IDN homograph)
defaultPref("network.IDN_show_punycode", true);

// JavaScript dentro de PDFs
defaultPref("pdfjs.enableScripting", false);

// Popups de autenticação HTTP disparados por sub-recursos de outros domínios
defaultPref("network.auth.subresource-http-auth-allow", 1);

// Envia só a origem (sem caminho) no Referer entre domínios diferentes
defaultPref("network.http.referer.XOriginTrimmingPolicy", 2);

// WebRTC: não expõe IPs locais/de outras interfaces (vazamento de IP com VPN)
defaultPref("media.peerconnection.ice.default_address_only", true);

// Extensões: sem aviso "permitir extensão de terceiros" silencioso
defaultPref("extensions.postDownloadThirdPartyPrompt", false);

// ===========================================================================
// 6. LEVEZA
// ===========================================================================
// Descarrega abas inativas quando a memória do sistema está acabando
defaultPref("browser.tabs.unloadOnLowMemory", true);

// Grava a sessão em disco a cada 60s em vez de 15s (menos escrita em disco)
defaultPref("browser.sessionstore.interval", 60000);
