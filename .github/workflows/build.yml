name: Build

# Compilação completa (várias horas num runner gratuito). Disparo manual ou por tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      # Runners gratuitos têm 16 GB de RAM e ~14 GB de disco livre: sem LTO.
      CLEANFOX_FAST_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaço em disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: make fetch prepare
      - run: make build
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: cleanfox-linux-x86_64
          path: dist/*
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
