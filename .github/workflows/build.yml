name: Build

# Compilação completa de todas as plataformas (várias horas cada). Disparo manual ou por
# tag vX.Y. Só o job de Linux já foi validado; veja "Estado e roadmap" no README.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Plataformas a compilar (separadas por espaço)"
        default: "linux macos windows android"
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Runners gratuitos têm pouca RAM e disco: sem LTO.
  CLEANFOX_FAST_BUILD: "1"

jobs:
  linux:
    if: github.event_name == 'push' || contains(inputs.platforms, 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # O mach da Mozilla só suporta Python até 3.12; o Python do runner pode ser mais novo.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Liberar espaço em disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: make fetch prepare
      - run: make build
      - run: make package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cleanfox-linux
          path: dist/*

  macos:
    if: github.event_name == 'push' || contains(inputs.platforms, 'macos')
    runs-on: macos-15 # Apple Silicon (a imagem macos-14 foi aposentada)
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # O mach da Mozilla só suporta Python até 3.12; o Python do runner pode ser mais novo.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: GnuPG (conferir a assinatura do código-fonte)
        run: command -v gpgv || brew install gnupg
      # O rustup do Homebrew no macos-15 não responde a "rustup which" como o mach espera;
      # usa o rustup oficial em ~/.cargo/bin (instala se o runner não tiver).
      - name: Rust (rustup oficial)
        run: |
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: make fetch prepare
      - run: make build
      - run: make package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cleanfox-macos
          path: dist/*

  windows:
    if: github.event_name == 'push' || contains(inputs.platforms, 'windows')
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      CLEANFOX_TARGET: windows
      # Caminho curto: a árvore do Firefox estoura o limite de 260 caracteres do Windows.
      CLEANFOX_BUILD_DIR: /c/cf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Instalar MozillaBuild
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile mb.exe
          Start-Process -Wait -FilePath .\mb.exe -ArgumentList '/S'
      # Mesmo ambiente que o start-shell.bat do MozillaBuild monta (PATH com Python,
      # ferramentas e o msys2), sem o shell interativo.
      - name: Compilar
        shell: cmd
        env:
          MOZILLABUILD: C:\mozilla-build\
          MSYS2_PATH_TYPE: inherit
          CHERE_INVOKING: "1"
        run: |
          set PATH=C:\mozilla-build\bin;C:\mozilla-build\kdiff3;C:\mozilla-build\python3;C:\mozilla-build\python3\Scripts;C:\mozilla-build\msys2\usr\bin;%PATH%
          C:\mozilla-build\msys2\usr\bin\bash.exe -lc "cd \"$(cygpath '%GITHUB_WORKSPACE%')\" && scripts/windows-ci.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cleanfox-windows
          path: dist/*

  android:
    if: github.event_name == 'push' || contains(inputs.platforms, 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CLEANFOX_TARGET: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # O mach da Mozilla só suporta Python até 3.12; o Python do runner pode ser mais novo.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Liberar espaço em disco
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: make fetch prepare
      - run: make build
      - run: make package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cleanfox-android-unsigned
          path: dist/*

  # Assinatura num job à parte: o job de build executa milhares de dependências de
  # terceiros (Gradle, Maven, Cargo, npm) e nenhuma delas deve conviver com a chave.
  # Configure o ambiente "release" em Settings > Environments para só aceitar tags v*.
  android-sign:
    needs: android
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cleanfox-android-unsigned
          path: dist
      # Sem estes secrets o APK continua com a chave de debug descartável: serve para
      # testar, mas não recebe atualização por cima. Veja "Android" no README.
      - name: Assinar com a chave do projeto
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          for apk in dist/*.apk; do
            "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" "$apk"
            (cd dist && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          done
          rm -f "$RUNNER_TEMP/release.jks" dist/*.idsig
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cleanfox-android
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows, android-sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # atestado de procedência (Sigstore)
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # Quem baixar confere com: gh attestation verify <arquivo> -R ${{ github.repository }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/cleanfox-*"
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
