name: Build

# Compilação completa de todas as plataformas (várias horas cada). Disparo manual ou por
# tag vX.Y. Só o job de Linux já foi validado; veja "Estado e roadmap" no README.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Runners gratuitos têm pouca RAM e disco: sem LTO.
  CLEANFOX_FAST_BUILD: "1"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaço em disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: make fetch prepare
      - run: make build
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: cleanfox-linux
          path: dist/*

  macos:
    runs-on: macos-14 # Apple Silicon
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: make fetch prepare
      - run: make build
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: cleanfox-macos
          path: dist/*

  windows:
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      CLEANFOX_TARGET: windows
      # Caminho curto: a árvore do Firefox estoura o limite de 260 caracteres do Windows.
      CLEANFOX_BUILD_DIR: /c/cf
    steps:
      - uses: actions/checkout@v4
      - name: Instalar MozillaBuild
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile mb.exe
          Start-Process -Wait -FilePath .\mb.exe -ArgumentList '/S'
      - name: Compilar
        shell: cmd
        run: C:\mozilla-build\msys2\usr\bin\bash.exe -lc "cd \"$(cygpath '%GITHUB_WORKSPACE%')\" && scripts/fetch.sh && scripts/prepare.sh && scripts/build.sh && scripts/package.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: cleanfox-windows
          path: dist/*

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CLEANFOX_TARGET: android
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaço em disco
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: make fetch prepare
      - run: make build
      - run: make package
      # Sem estes secrets o APK sai assinado com uma chave de debug descartável: serve
      # para testar, mas não recebe atualização por cima. Veja "Android" no README.
      - name: Assinar com a chave do projeto
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          for apk in dist/*.apk; do
            "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" "$apk"
            sha256sum "$apk" | sed "s|dist/||" > "$apk.sha256"
          done
          rm -f "$RUNNER_TEMP/release.jks" dist/*.idsig
      - uses: actions/upload-artifact@v4
        with:
          name: cleanfox-android
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
