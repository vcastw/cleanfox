name: Build

# Compilação completa de todas as plataformas (várias horas cada). Disparo manual ou por
# tag vX.Y. Estado de cada plataforma: "Plataformas" no README.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Plataformas a compilar (separadas por espaço)"
        default: "linux macos windows android"
      release_tag:
        description: "Publicar release com esta tag (ex.: v0.1). Vazio = só compilar. Exige todas as plataformas."
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Runners gratuitos têm pouca RAM e disco: sem LTO.
  COLDFOX_FAST_BUILD: "1"

jobs:
  # Release sem a chave do projeto falha aqui, em segundos, e não depois de horas de
  # compilação. Um APK publicado com chave de debug não recebe atualização por cima.
  release-check:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release sem a chave do Android. Rode tools/gerar-chave-android.sh (README, Assinatura)."
            exit 1
          fi

  linux:
    if: github.event_name == 'push' || contains(inputs.platforms, 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # O mach da Mozilla só suporta Python até 3.12; o Python do runner pode ser mais novo.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Liberar espaço em disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: make fetch prepare
      - run: make build
      - run: make package
      # O pacote só sai se o binário final passar nos testes de runtime.
      - name: Testar o binário compilado
        run: |
          mkdir -p "$RUNNER_TEMP/cf" && tar -xf dist/coldfox-*-linux-*.tar.xz -C "$RUNNER_TEMP/cf"
          b="$RUNNER_TEMP/cf/coldfox/coldfox"
          tests/check-runtime.py "$b"
          tests/check-extensions.py "$b"
          tests/check-network.py "$b" 120
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coldfox-linux
          path: dist/*

  macos:
    if: github.event_name == 'push' || contains(inputs.platforms, 'macos')
    runs-on: macos-15 # Apple Silicon (a imagem macos-14 foi aposentada)
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # O mach da Mozilla só suporta Python até 3.12; o Python do runner pode ser mais novo.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: GnuPG (conferir a assinatura do código-fonte)
        run: command -v gpgv || brew install gnupg
      # O rustup do Homebrew no macos-15 não responde a "rustup which" como o mach espera;
      # usa o rustup oficial em ~/.cargo/bin (instala se o runner não tiver).
      - name: Rust (rustup oficial)
        run: |
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: make fetch prepare
      - run: make build
      - run: make package
      - name: Testar o binário compilado
        run: |
          hdiutil attach dist/coldfox-*-macos-*.dmg -mountpoint "$RUNNER_TEMP/cfdmg" -nobrowse
          b="$(find "$RUNNER_TEMP/cfdmg" -maxdepth 4 -path '*Contents/MacOS/coldfox' | head -1)"
          test -x "$b"
          tests/check-runtime.py "$b"
          tests/check-extensions.py "$b"
          tests/check-network.py "$b" 120
          hdiutil detach "$RUNNER_TEMP/cfdmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coldfox-macos
          path: dist/*

  windows:
    if: github.event_name == 'push' || contains(inputs.platforms, 'windows')
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      COLDFOX_TARGET: windows
      # Caminho curto: a árvore do Firefox estoura o limite de 260 caracteres do Windows.
      COLDFOX_BUILD_DIR: /c/cf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Instalar MozillaBuild
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile mb.exe
          Start-Process -Wait -FilePath .\mb.exe -ArgumentList '/S'
      # Mesmo ambiente que o start-shell.bat do MozillaBuild monta (PATH com Python,
      # ferramentas e o msys2), sem o shell interativo.
      - name: Compilar
        shell: cmd
        env:
          MOZILLABUILD: C:\mozilla-build\
          MSYS2_PATH_TYPE: inherit
          CHERE_INVOKING: "1"
        run: |
          set PATH=C:\mozilla-build\bin;C:\mozilla-build\kdiff3;C:\mozilla-build\python3;C:\mozilla-build\python3\Scripts;C:\mozilla-build\msys2\usr\bin;%PATH%
          C:\mozilla-build\msys2\usr\bin\bash.exe -lc "cd \"$(cygpath '%GITHUB_WORKSPACE%')\" && scripts/windows-ci.sh"
      # O pacote só sai se o binário final passar nos testes de runtime.
      - name: Testar o binário compilado
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          7z x -y -o"$RUNNER_TEMP/cf" dist/coldfox-*-windows-*.zip > /dev/null
          b="$RUNNER_TEMP/cf/coldfox/coldfox.exe"
          test -f "$b"
          python tests/check-runtime.py "$b"
          python tests/check-extensions.py "$b"
          python tests/check-network.py "$b" 120
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coldfox-windows
          path: dist/*

  android:
    if: github.event_name == 'push' || contains(inputs.platforms, 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      COLDFOX_TARGET: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # O mach da Mozilla só suporta Python até 3.12; o Python do runner pode ser mais novo.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Liberar espaço em disco
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      # Gradle, Rust e C++ juntos estouram os 16 GB do runner ("lost communication").
      - name: Swap de 16 GB
        run: |
          sudo swapoff -a
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - run: make fetch prepare
      - name: make build (com registro de memória a cada 2 min)
        run: |
          (while sleep 120; do echo "[memória] $(free -m | awk 'NR==2{print "RAM " $3 "/" $2 " MB"} NR==3{print "swap " $3 "/" $2 " MB"}' | tr '\n' ' ')"; done) &
          make build
      - run: make package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-android
          path: dist/*

  # Assinatura num job à parte: o job de build executa milhares de dependências de
  # terceiros (Gradle, Maven, Cargo, npm) e nenhuma delas deve conviver com a chave.
  # Configure o ambiente "release" em Settings > Environments para só aceitar tags v*.
  android-sign:
    needs: android
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-android
          path: dist
      # Sem os secrets (compilação de teste) o APK fica com a chave de debug descartável;
      # num release isso é barrado em release-check e de novo no passo de conferência.
      - name: Assinar com a chave do projeto
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          for apk in dist/*.apk; do
            "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" "$apk"
            (cd dist && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          done
          rm -f "$RUNNER_TEMP/release.jks" dist/*.idsig
      # Confere a assinatura de cada APK e mostra de quem é; num release, chave de debug
      # ou APKs com chaves diferentes reprovam.
      - name: Conferir a assinatura
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' }}
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          for apk in dist/*.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            echo "$(basename "$apk"): $(grep -m1 'certificate DN' <<< "$certs")"
            grep -m1 'certificate SHA-256' <<< "$certs" | awk '{print $NF}' >> "$RUNNER_TEMP/fprs"
            if [ "$IS_RELEASE" = true ] && grep -q 'Android Debug' <<< "$certs"; then
              echo "::error::$(basename "$apk") está com a chave de debug"; exit 1
            fi
          done
          [ "$(sort -u "$RUNNER_TEMP/fprs" | wc -l)" = 1 ] || { echo "::error::APKs assinados com chaves diferentes"; exit 1; }
          echo "Impressão digital SHA-256 do certificado dos APKs: \`$(head -1 "$RUNNER_TEMP/fprs")\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coldfox-android
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: [release-check, linux, macos, windows, android-sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # atestado de procedência (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # Só os artefatos finais: "unsigned-android" tem os mesmos nomes de arquivo do
          # APK assinado e, baixado junto, poderia sobrescrevê-lo.
          pattern: coldfox-*
          path: dist
          merge-multiple: true
      # Confere os .sha256 da compilação, tira a versão dos nomes (links fixos do README)
      # e gera o SHA256SUMS e as notas.
      - run: scripts/release-assets.sh dist "$RUNNER_TEMP/notas.md"
      # Quem baixar confere com: gh attestation verify <arquivo> -R ${{ github.repository }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/coldfox-*
            dist/SHA256SUMS
      # No disparo manual a tag vem do campo release_tag e é criada aqui, no commit compilado.
      # Sai como rascunho e só é publicado com todos os arquivos enviados: um envio que
      # falha no meio não deixa release pela metade. Não é marcado como pré-lançamento
      # porque os links .../releases/latest/download/ ignoram pré-lançamentos.
      - run: |
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "tag inválida: $tag"; exit 1; }
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "ColdFox $tag" --notes-file "$RUNNER_TEMP/notas.md" --generate-notes
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
